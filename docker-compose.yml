# Dev stack. Start everything:  docker compose up --build -d
# Shows up in Docker Desktop as one group: "servertest".
name: servertest

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./server/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - keycloak
      - products
      - stock
      - web
    restart: unless-stopped

  # Identity provider (OIDC). Issues the JWTs every service validates.
  # Browsers/apps reach it through the gateway at ${KEYCLOAK_HOSTNAME} (http://localhost/auth);
  # services reach it directly at http://keycloak:8080/auth.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: ${KEYCLOAK_DB_URL}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}            # fixes the token issuer, whoever asks
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"     # services may use http://keycloak:8080
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      STOCK_CLIENT_SECRET: ${STOCK_CLIENT_SECRET} # substituted into the realm file on import
    volumes:
      - ./server/keycloak/realm:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl/wget; use bash's /dev/tcp against the management port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  products:
    build:
      context: ./server/products-service
      target: dev
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/products_db
      DB_USER: ${PRODUCTS_DB_USER}
      DB_PASSWORD: ${PRODUCTS_DB_PASSWORD}
      OAUTH_ISSUER: ${KEYCLOAK_HOSTNAME}/realms/servertest
      OAUTH_JWKS_URI: http://keycloak:8080/auth/realms/servertest/protocol/openid-connect/certs
    volumes:
      - ./server/products-service:/app   # your code, live
      - m2-cache:/root/.m2               # Maven dependency cache
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  stock:
    build:
      context: ./server/stock-service
      target: dev
    environment:
      DATABASE_URL: postgres://${STOCK_DB_USER}:${STOCK_DB_PASSWORD}@postgres:5432/stock_db?sslmode=disable
      OAUTH_ISSUER: ${KEYCLOAK_HOSTNAME}/realms/servertest
      OAUTH_JWKS_URI: http://keycloak:8080/auth/realms/servertest/protocol/openid-connect/certs
      OAUTH_AUDIENCE: stock-service
      OAUTH_TOKEN_URL: http://keycloak:8080/auth/realms/servertest/protocol/openid-connect/token
      OAUTH_CLIENT_ID: stock-service
      OAUTH_CLIENT_SECRET: ${STOCK_CLIENT_SECRET}
      PRODUCTS_URL: http://products:8080
    volumes:
      - ./server/stock-service:/app      # your code, live
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./client/frontend
      target: dev
    volumes:
      - ./client/frontend:/app           # your code, live
      - /app/node_modules                # keep the container's Linux node_modules
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PRODUCTS_DB_USER: ${PRODUCTS_DB_USER}
      PRODUCTS_DB_PASSWORD: ${PRODUCTS_DB_PASSWORD}
      STOCK_DB_USER: ${STOCK_DB_USER}
      STOCK_DB_PASSWORD: ${STOCK_DB_PASSWORD}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}         # dev only, used by init/02-keycloak.sh
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - "5432:5432"                      # for DB tools on your Mac (TablePlus, DBeaver, psql)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 forces TCP, which only opens after the init scripts finish
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  m2-cache:
  go-mod-cache:
  go-build-cache:
