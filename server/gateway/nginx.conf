# API gateway: the single entry point (host port 80).
#   /api/products, /api/products/*  -> products (Spring Boot)
#   /api/stock/*     -> stock    (Go)
#   /auth/*          -> keycloak (identity provider: login pages, tokens, JWKS)
#   /*               -> web      (React/Vite dev server)
#
# Upstreams are resolved through Docker's DNS at request time (resolver +
# variables), so nginx starts even if a service is still booting or down.
# After editing: docker compose exec gateway nginx -s reload

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    set $products_upstream http://products:8080;
    set $stock_upstream    http://stock:8080;
    set $web_upstream      http://web:5173;
    set $keycloak_upstream http://keycloak:8080;

    # Prefix without trailing slash so the collection URL /api/products (list/create)
    # is proxied too, instead of nginx answering it with a 301 redirect.
    location /api/products {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass $products_upstream;
        error_page 502 503 504 = @service_unavailable;
    }

    location /api/stock/ {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass $stock_upstream;
        error_page 502 503 504 = @service_unavailable;
    }

    # Keycloak runs with KC_HTTP_RELATIVE_PATH=/auth, so the path is passed through unchanged.
    # The gateway does not check tokens: each service validates them itself.
    location /auth/ {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        # Keycloak sends large cookies/headers on login.
        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;
        proxy_pass $keycloak_upstream;
        error_page 502 503 504 = @service_unavailable;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Upgrade    $http_upgrade;       # Vite HMR websocket
        proxy_set_header Connection $connection_upgrade;
        proxy_pass $web_upstream;
    }

    location @service_unavailable {
        default_type application/json;
        return 503 '{"error":"service unavailable (gateway could not reach it)","path":"$uri"}';
    }
}
